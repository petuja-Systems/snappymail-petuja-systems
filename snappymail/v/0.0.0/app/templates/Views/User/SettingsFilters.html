<div class="form-horizontal">
	<div class="legend">
		<span data-i18n="SETTINGS_LABELS/FILTERS"></span>
		&nbsp;&nbsp;&nbsp;
		<i class="ui-spinner" style="margin-top: 5px" data-bind="visible: loading"></i>
	</div>
</div>
<div class="alert alert-error g-ui-user-select-none" data-bind="visible: serverError, text: serverErrorDesc" data-ui-icon="triangle-alert"></div>
<table class="table table-hover list-table g-ui-user-select-none">
	<colgroup>
		<col style="width: 30px">
		<col>
		<col style="width: 140px">
		<col style="width: 1em">
	</colgroup>
	<tbody>
		<tr class="script-item">
			<td style="border:0"><button type="button" class="e-action ui-icon-only" data-bind="click: disableScripts, attr: {'aria-pressed': !hasActive(), 'data-ui-icon': hasActive() ? 'circle' : 'circle-dot'}" data-i18n="[aria-label]GLOBAL/INACTIVE"></button></td>
			<td style="border:0" data-i18n="GLOBAL/INACTIVE">Inactive</td>
			<td style="border:0"></td>
			<td style="border:0"></td>
		</tr>
	</tbody>
	<tbody data-bind="foreach: scripts, i18nUpdate: scripts">
		<!-- ko if: allowFilters() -->
		<tr class="script-item">
			<td><button type="button" class="e-action ui-icon-only" data-bind="visible: body, click: function (oScript) { $root.enableScript(oScript); }, attr: {'aria-label': name(), 'aria-pressed': active(), 'data-ui-icon': active() ? 'circle-dot' : 'circle'}"></button></td>
			<td><button type="button" class="e-action script-name ui-text-action" data-i18n="SETTINGS_FILTERS/SIMPLE" data-bind="attr:{title: name}"></button></td>
			<td></td>
			<td></td>
		</tr>
		<tr><th colspan="4" data-i18n="SETTINGS_FILTERS/ADVANCED"></th></tr>
		<!-- /ko -->
		<!-- ko if: !allowFilters() -->
		<tr class="script-item">
			<td><button type="button" class="e-action ui-icon-only" data-bind="visible: body, click: function (oScript) { $root.enableScript(oScript); }, attr: {'aria-label': name(), 'aria-pressed': active(), 'data-ui-icon': active() ? 'circle-dot' : 'circle'}"></button></td>
			<td><button type="button" class="e-action script-name ui-text-action" data-bind="text: name"></button></td>
			<td>
				<button type="button" class="btn btn-small btn-danger button-confirm-delete" data-bind="css: {'delete-access': askDelete}, hasfocus: askDelete, click: function(oScript) { $root.deleteScript(oScript); }"
					data-i18n="GLOBAL/ARE_YOU_SURE"></button>
			</td>
			<td>
				<button type="button" class="e-action ui-icon ui-icon-only" data-bind="visible: !askDelete() && !allowFilters(), click: function (oScript) { $root.scriptForDeletion(oScript); }" data-ui-icon="trash-2" data-i18n="[aria-label]GLOBAL/DELETE"></button>
			</td>
		</tr>
		<!-- /ko -->
	</tbody>
</table>
<button type="button" class="btn" data-bind="click: addScript" data-ui-icon="plus" data-i18n="SETTINGS_FILTERS/BUTTON_ADD_SCRIPT"></button>
