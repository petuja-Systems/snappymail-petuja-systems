<div class="btn-toolbar" data-bind="css: {'hasChecked':checkAll}">
	<button type="button" class="btn btn-thin ui-icon toggleLeft" data-ui-icon="spacer" data-i18n="[title]SETTINGS_LABELS/FOLDERS"></button>
	<button type="button" class="btn buttonCompose ui-icon-only onCheckedHide" data-bind="click: composeClick, css: {'btn-warning': composeInEdit, 'btn-success': !composeInEdit()}" data-i18n="[title]FOLDER_LIST/BUTTON_NEW_MESSAGE">
		<i class="" data-ui-icon="send"></i>
	</button>
	<button type="button" class="btn ui-icon-only onCheckedHide" data-bind="click: reload" data-i18n="[title]MESSAGE_LIST/BUTTON_RELOAD">
		<i class="ui-spinner not-animated"></i>
	</button>
	<button type="button" class="btn ui-icon-only onCheckedShow" data-bind="command: moveCommand" data-i18n="[title]GLOBAL/MOVE_TO">
		<i class="visible-on-ctrl-btn" data-ui-icon="copy"></i>
		<i class="ui-icon hidden-on-ctrl-btn" data-ui-icon="folder"></i>
	</button>
	<div class="btn-group onCheckedShow">
		<button type="button" class="btn ui-icon" data-bind="visible: archiveAllowed, command: archiveCommand" data-i18n="[title]GLOBAL/TO_ARCHIVE" data-ui-icon="archive"></button>
		<button type="button" class="btn ui-icon" data-bind="visible: canMarkAsSpam, command: spamCommand" data-i18n="[title]GLOBAL/TO_SPAM" data-ui-icon="flame"></button>
		<button type="button" class="btn ui-icon-only" data-bind="visible: isSpamFolder, command: notSpamCommand" data-i18n="[title]GLOBAL/NOT_SPAM">
			<i class="" data-ui-icon="circle-check"></i>
		</button>
		<button type="button" class="btn ui-icon" data-bind="command: deleteCommand" data-i18n="[title]GLOBAL/DELETE" data-ui-icon="trash-2"></button>
<!--
		<a class="btn ui-icon" data-bind="command: undeleteCommand, hidden: hideDeleted" data-i18n="[title]GLOBAL/UNDELETE" style="transform:rotate(-180deg)" data-ui-icon="trash-2"></a>
-->
	</div>
	<div class="btn-group dropdown" data-bind="registerBootstrapDropdown: true">
		<button type="button" id="more-list-dropdown-id" class="btn dropdown-toggle ui-icon" aria-haspopup="menu" data-i18n="[title]GLOBAL/MORE" data-ui-icon="more-horizontal"></button>
		<menu class="dropdown-menu" role="menu" aria-labelledby="more-list-dropdown-id">
			<li role="presentation" data-bind="click: listUnsetSeen, css: {'disabled': !messageList.hasCheckedOrSelected()}">
				<a href="#" tabindex="-1" data-ui-icon="mail" data-i18n="MESSAGE_LIST/MENU_UNSET_SEEN"></a>
			</li>
			<li role="presentation" data-bind="click: listSetSeen, css: {'disabled': !messageList.hasCheckedOrSelected()}">
				<a href="#" tabindex="-1" data-ui-icon="mail-open" data-i18n="MESSAGE_LIST/MENU_SET_SEEN"></a>
			</li>
			<li role="presentation" data-bind="click: listSetFlags, css: {'disabled': !messageList.hasCheckedOrSelected()}">
				<a href="#" tabindex="-1" data-ui-icon="star" data-i18n="MESSAGE_LIST/MENU_SET_FLAG"></a>
			</li>
			<li role="presentation" data-bind="click: listUnsetFlags, css: {'disabled': !messageList.hasCheckedOrSelected()}">
				<a href="#" tabindex="-1" data-ui-icon="star" data-i18n="MESSAGE_LIST/MENU_UNSET_FLAG"></a>
			</li>
			<li role="presentation" data-bind="click: listSetAllSeen, css: {'disabled': !messageList().length}">
				<a href="#" tabindex="-1" data-ui-icon="check-check" data-i18n="MESSAGE_LIST/MENU_SET_ALL_SEEN"></a>
			</li>
			<li class="dividerbar" role="presentation" data-bind="command: forwardCommand">
				<a href="#" tabindex="-1" data-ui-icon="reply-all" data-i18n="MESSAGE_LIST/BUTTON_MULTY_FORWARD"></a>
			</li>
			<li role="presentation" data-bind="command: downloadAttachCommand, visible: downloadAsZipAllowed">
				<a href="#" tabindex="-1" data-ui-icon="package" data-i18n="MESSAGE_LIST/DOWNLOAD_ALL_ATTACHMENTS"></a>
			</li>
			<li role="presentation" data-bind="command: downloadZipCommand, visible: downloadAsZipAllowed">
				<a href="#" tabindex="-1" data-ui-icon="save" data-i18n="MESSAGE/LINK_DOWNLOAD_AS_ZIP"></a>
			</li>
			<li class="dividerbar" role="presentation" data-bind="command: moveCommand">
				<a href="#" tabindex="-1" data-ui-icon="folder" data-i18n="GLOBAL/MOVE_TO"></a>
			</li>
			<li class="presentation" role="presentation" data-bind="command: copyCommand">
				<a href="#" tabindex="-1" data-ui-icon="copy" data-i18n="GLOBAL/COPY_TO"></a>
			</li>
			<li role="presentation" data-bind="visible: archiveAllowed, command: archiveCommand">
				<a href="#" tabindex="-1" data-ui-icon="archive" data-i18n="GLOBAL/TO_ARCHIVE"></a>
			</li>
			<li role="presentation" data-bind="visible: canMarkAsSpam, command: spamCommand">
				<a href="#" tabindex="-1" data-ui-icon="flame" data-i18n="GLOBAL/SPAM"></a>
			</li>
			<li role="presentation" data-bind="visible: isSpamFolder, command: notSpamCommand">
				<a href="#" tabindex="-1" data-ui-icon="shield-check" data-i18n="GLOBAL/NOT_SPAM"></a>
			</li>
			<li role="presentation" data-bind="command: deleteCommand">
				<a href="#" tabindex="-1" data-ui-icon="trash-2" data-i18n="GLOBAL/DELETE"></a>
			</li>
			<li role="presentation" data-bind="command: undeleteCommand, hidden: hideDeleted">
				<a href="#" tabindex="-1" data-ui-icon="trash-2" data-i18n="GLOBAL/UNDELETE" class="rotate"></a>
			</li>
			<li role="presentation" data-bind="visible: allowDangerousActions, command: deleteWithoutMoveCommand">
				<a href="#" tabindex="-1" data-ui-icon="trash-2" data-i18n="MESSAGE_LIST/BUTTON_DELETE_WITHOUT_MOVE"></a>
			</li>
			<li role="presentation" data-bind="visible: allowDangerousActions, click: clear">
				<a href="#" tabindex="-1" data-ui-icon="flame" data-i18n="MESSAGE_LIST/BUTTON_EMPTY_FOLDER"></a>
			</li>
		</menu>
	</div>
	<div class="btn-group dropdown onCheckedHide" data-bind="visible: !sortSupported()">
		<div id="no-sort-list" class="btn ui-icon" data-i18n="[title]MESSAGE_LIST/NO_SORT" data-ui-icon="x"></div>
	</div>
	<div class="btn-group dropdown onCheckedHide" data-bind="visible: sortSupported(), registerBootstrapDropdown: true">
		<button type="button" id="sort-list-dropdown-id" class="btn dropdown-toggle ui-icon" aria-haspopup="menu" data-i18n="[title]MESSAGE_LIST/SORT">
			<i class="sort-field-icon" data-bind="attr: {'data-ui-icon': sortFieldIcon}"></i>
			<i data-bind="attr: {'data-ui-icon': sortDirectionIcon}"></i>
		</button>
		<menu class="dropdown-menu" role="menu" aria-labelledby="sort-list-dropdown-id">
			<li role="presentation" data-sort="" data-bind="click: changeSort">
				<a href="#" tabindex="-1" data-ui-icon="arrow-down-wide-narrow" data-i18n="MESSAGE_LIST/SORT_DATE_DESC"></a>
			</li>
			<li role="presentation" data-sort="DATE" data-bind="click: changeSort">
				<a href="#" tabindex="-1" data-ui-icon="arrow-up-narrow-wide" data-i18n="MESSAGE_LIST/SORT_DATE_ASC"></a>
			</li>
			<li class="dividerbar" role="presentation" data-sort="FROM" data-bind="click: changeSort">
				<a href="#" tabindex="-1" data-ui-icon="arrow-down-wide-narrow" data-i18n="MESSAGE_LIST/SORT_FROM_ASC"></a>
			</li>
			<li role="presentation" data-sort="REVERSE FROM" data-bind="click: changeSort">
				<a href="#" tabindex="-1" data-ui-icon="arrow-up-narrow-wide" data-i18n="MESSAGE_LIST/SORT_FROM_DESC"></a>
			</li>
			<li class="dividerbar" role="presentation" data-sort="REVERSE SIZE" data-bind="click: changeSort">
				<a href="#" tabindex="-1" data-ui-icon="arrow-down-wide-narrow" data-i18n="MESSAGE_LIST/SORT_SIZE_DESC"></a>
			</li>
			<li role="presentation" data-sort="SIZE" data-bind="click: changeSort">
				<a href="#" tabindex="-1" data-ui-icon="arrow-up-narrow-wide" data-i18n="MESSAGE_LIST/SORT_SIZE_ASC"></a>
			</li>
			<li class="dividerbar" role="presentation" data-sort="SUBJECT" data-bind="click: changeSort">
				<a href="#" tabindex="-1" data-ui-icon="arrow-down-wide-narrow" data-i18n="MESSAGE_LIST/SORT_SUBJECT_ASC"></a>
			</li>
			<li role="presentation" data-sort="REVERSE SUBJECT" data-bind="click: changeSort">
				<a href="#" tabindex="-1" data-ui-icon="arrow-up-narrow-wide" data-i18n="MESSAGE_LIST/SORT_SUBJECT_DESC"></a>
			</li>
		</menu>
	</div>
</div>

<div class="messageList g-ui-user-select-none" data-bind="css: {'hideMessageListCheckbox': !useCheckboxesInList() }">
	<div class="second-toolbar thm-message-list-top-toolbar">
		<button type="button" class="checkboxCheckAll" data-i18n="[aria-label]MESSAGE_LIST/LABEL_CHECK_ALL" data-bind="attr: {'data-ui-icon': checkAll() ? (isIncompleteChecked() ? 'square-dashed' : 'square-check') : 'square'}"></button>
		<div class="search-input-wrp">
			<input type="search" class="inputSearch" placeholder="Search" autocorrect="off" autocapitalize="off" data-i18n="[placeholder]GLOBAL/SEARCH" data-bind="textInput: inputSearch, hasfocus: focusSearch">
		<button type="button" class="closeSearch ui-icon-only" data-bind="click: cancelSearch, visible: messageListSearchDesc()" data-ui-icon="x" data-i18n="[title]GLOBAL/CLOSE"></button>
		</div>
		<button type="button" class="btn buttonMoreSearch ui-icon-only" data-bind="click: advancedSearchClick" data-ui-icon="chevron-down" data-i18n="[title]SEARCH/TITLE_ADV"></button>
	</div>
	<div class="b-content" tabindex="0">
		<button type="button" class="listThreadUidDesc" data-bind="visible: messageList.threadUid(), click: cancelThreadUid"
			data-ui-icon="arrow-left" data-i18n="MESSAGE_LIST/BACK_TO_MESSAGE_LIST"></button>
		<div class="listSearchDesc" data-bind="visible: messageListSearchDesc(), text: messageListSearchDesc"></div>
		<div class="listDragOver" data-bind="css: {'viewAppendArea': dragOver() && !messageList.error() && !popupVisibility(), 'dragOverEnter': dragOverEnter }"
			data-ui-icon="arrow-down" data-i18n="MESSAGE_LIST/PUT_MESSAGE_HERE"></div>
		<div class="listClear" data-bind="visible: clearListIsVisible()">
			<a href="#" class="g-ui-link" data-i18n="MESSAGE_LIST/BUTTON_EMPTY_FOLDER" data-bind="click: clear"></a>
		</div>
		<div class="listError error" data-bind="visible: !dragOver() && messageList.error(), text: messageList.error"></div>
		<div class="listEmptyMessage" data-bind="visible: listEmptyMessage(), text: listEmptyMessage()"></div>
		<div class="listLoading" data-bind="visible: !dragOver() && !messageList().length &&
			messageList.isLoading() && !messageList.error()">
			<i class="ui-spinner"></i>
			<span data-i18n="GLOBAL/LOADING"></span>
		</div>

		<!-- ko if: listGrouped -->
		<div class="messageListPlace" data-bind="dragmessages: 1, i18nUpdate: groupedList, foreach: groupedList" draggable="true">
			<button type="button" class="groupLabel" data-bind="text: label, click: $root.groupSearch" data-i18n="[title]GLOBAL/SEARCH"></button>
			<!-- ko foreach: messages -->
			<div class="messageListItem" data-bind="css: lineAsCss(), attr: {title: preview}">
				<div class="messageCheckbox">
					<div class="checkboxMessage" data-bind="attr: {'data-ui-icon': checked() ? 'square-check' : 'square'}"></div>
				</div><div>
					<div class="flagParent" data-bind="attr: {'data-ui-icon': isFlagged() ? 'star-filled' : 'star'}"></div>
					<div class="senderParent" data-bind="attr: {title: senderClearEmailsString, 'data-ui-icon': flags().includes('\\answered') && flags().includes('$forwarded') ? 'arrow-left-right' : flags().includes('\\answered') ? 'arrow-left' : flags().includes('$forwarded') ? 'arrow-right' : ''}, text: senderEmailsString"></div>
					<div class="subjectParent" data-bind="text: subject"></div>
					<div class="threads-len" data-bind="visible: 1 < threadsLen(), text: threadsLenText(), attr: {'data-unseen': threadUnseenLen() || null}"></div>
					<div class="attachmentParent">
						<i data-bind="attr: {'data-ui-icon': attachmentIconClass}"></i>
					</div>
					<div class="sizeParent" data-bind="text: friendlySize()"></div>
					<time data-bind="attr:{'data-time-format':$root.timeFormat()}, time: dateTimestamp"></time>
				</div>
			</div>
			<!-- /ko -->
		</div>
		<!-- /ko -->
		<!-- ko ifnot: listGrouped -->
		<div class="messageListPlace" data-bind="dragmessages: 1, foreach: messageList" draggable="true">
			<div class="messageListItem" data-bind="css: lineAsCss(), attr:{title:preview}">
				<div class="messageCheckbox">
					<div class="checkboxMessage" data-bind="attr: {'data-ui-icon': checked() ? 'square-check' : 'square'}"></div>
				</div><div data-bind="attr:{style:indent()}, css:{reply:indent()}">
					<div class="flagParent" data-bind="attr: {'data-ui-icon': isFlagged() ? 'star-filled' : 'star'}"></div>
					<div class="senderParent" data-bind="attr: {title: senderClearEmailsString, 'data-ui-icon': flags().includes('\\answered') && flags().includes('$forwarded') ? 'arrow-left-right' : flags().includes('\\answered') ? 'arrow-left' : flags().includes('$forwarded') ? 'arrow-right' : ''}, text: senderEmailsString"></div>
					<div class="subjectParent" data-bind="text: subject"></div>
					<div class="threads-len" data-bind="visible: 1 < threadsLen(), text: threadsLenText(), attr: {'data-unseen': threadUnseenLen() || null}"></div>
					<div class="attachmentParent">
						<i data-bind="attr: {'data-ui-icon': attachmentIconClass}"></i>
					</div>
					<div class="sizeParent" data-bind="text: friendlySize()"></div>
					<time data-time-format="AUTO" data-bind="time: dateTimestamp"></time>
				</div>
			</div>
		</div>
		<!-- /ko -->

		<div id="messagesDragImage"><span class="text"></span>&nbsp;<span class="ui-icon" data-ui-icon="mail"></span></div>
	</div>
	<div class="b-footer thm-message-list-bottom-toolbar">
		<!-- ko if: userUsageProc() -->
		<span data-bind="attr: { title: quotaTooltip() }" class="e-quota">
			<!-- ko text: userUsageProc --><!-- /ko -->%
		</span>
		<!-- /ko -->
		<!-- ko template: { name: 'Paginator', data: messageListPaginator } --><!-- /ko -->
	</div>
</div>
