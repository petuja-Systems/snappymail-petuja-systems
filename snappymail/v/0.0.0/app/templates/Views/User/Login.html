<div class="login-brand">
	<img class="login-brand-logo"
		data-bind="attr: { src: loginLogoUrl }"
		alt="petuja Systems"
		width="80"
		height="80"
	/>
	<h1>petuja.email</h1>
</div>

<div class="descWrapper" data-i18n="LOGIN/TAGLINE"></div>
<div class="alert" role="alert" aria-live="assertive" data-bind="hidden: !submitError()" hidden="">
	<a href="#" class="close" data-bind="click: hideError" data-i18n="[title]GLOBAL/CLOSE" data-ui-icon="x"></a>
	<span data-bind="text: submitError"></span>
	<p data-bind="visible: '' !== submitErrorAdditional()">
		<span data-i18n="GLOBAL/SERVER_MESSAGE"></span>:
	<!-- ko text: submitErrorAdditional --><!-- /ko -->
	</p>
</div>
<form action="#/"  spellcheck="false" method="POST"
	data-bind="submit: submitCommand, css: {'errorAnimated': formError, 'submitting': submitRequest()}, attr: {'aria-busy': submitRequest() ? 'true' : 'false'}">
	<!-- ko if: 'primary' === loginStep() -->
	<div class="controls" data-bind="css: {'error': emailError}, i18nUpdate: loginStep">
		<label for="login-email" data-i18n="GLOBAL/EMAIL"></label>
		<input id="login-email" name="Email" required="" type="text" class="input-block-level" pattern="[^@\s]+(@[^\s]+)?" inputmode="email"
			autofocus="" autocomplete="email" autocorrect="off" autocapitalize="off"
			data-bind="textInput: email, disable: submitRequest"
			data-i18n="[placeholder]GLOBAL/EMAIL">
	</div>
	<div class="controls" data-bind="css: {'error': passwordError}, i18nUpdate: loginStep">
		<label for="login-password" data-i18n="GLOBAL/PASSWORD"></label>
		<input id="login-password" name="Password" required="" type="password" class="input-block-level"
			autocomplete="current-password" autocorrect="off" autocapitalize="off"
			data-bind="textInput: password, disable: submitRequest"
			data-i18n="[placeholder]GLOBAL/PASSWORD">
	</div>
	<!-- /ko -->
	<!-- ko if: 'primary' === loginStep() -->
	<div class="controls login-options" data-bind="i18nUpdate: loginStep">
		<div class="e-checkbox" role="checkbox"
			data-bind="visible: signMeVisibility, click: toggleSignMe, onSpace: toggleSignMe, css: {'is-disabled': submitRequest()}, attr: {'aria-checked': signMe, 'aria-disabled': submitRequest() ? 'true' : 'false', tabindex: submitRequest() ? '-1' : '0'}"
			aria-labelledby="login-sign-me-label">
			<i aria-hidden="true" data-bind="attr: {'data-ui-icon': signMe() ? 'square-check' : 'square'}"></i>
			<span id="login-sign-me-label" data-i18n="LOGIN/LABEL_SIGN_ME"></span>
		</div>
		<div class="language-buttons">
			<a href="#" class="language-button ui-icon"
				data-bind="visible: allowLanguagesOnLogin, click: selectLanguage, css: { 'ui-spinner' : langRequest }, attr: {'aria-disabled': submitRequest() || langRequest() ? 'true' : 'false'}"
				data-i18n="[title]POPUPS_LANGUAGES/TITLE_LANGUAGES">
				<span class="login-visually-hidden" data-i18n="POPUPS_LANGUAGES/TITLE_LANGUAGES"></span>
				<span aria-hidden="true" data-ui-icon="globe"></span>
			</a>
		</div>
	</div>
	<div class="login-submit" data-bind="i18nUpdate: loginStep">
		<button type="submit" class="btn btn-large buttonLogin"
			data-bind="click: submitCommand, disable: submitRequest"
			data-i18n="LOGIN/BUTTON_SIGN_IN"></button>
	</div>
	<!-- /ko -->
	<!-- ko if: 'factor' === loginStep() -->
	<div class="login-factor-step" data-bind="i18nUpdate: loginStep">
		<h2 id="login-factor-title" data-i18n="LOGIN/TWO_FACTOR_TITLE"></h2>
		<p id="login-factor-instruction" data-i18n="LOGIN/TWO_FACTOR_INSTRUCTION"></p>
		<div class="controls login-factor-control">
			<label for="login-factor-code" data-i18n="LOGIN/TWO_FACTOR_CODE"></label>
			<input id="login-factor-code" name="Code" required="" type="text" class="input-block-level"
				inputmode="numeric" autocomplete="one-time-code" spellcheck="false"
				autocorrect="off" autocapitalize="off"
				aria-describedby="login-factor-instruction"
				data-bind="textInput: factorCode, disable: submitRequest">
		</div>
		<div class="login-factor-actions">
			<button type="submit" class="btn btn-large buttonLogin"
				data-bind="click: submitCommand, disable: submitRequest"
				data-i18n="LOGIN/BUTTON_VERIFY"></button>
			<button type="button" class="btn login-back"
				data-bind="click: backToPrimary, disable: submitRequest"
				data-i18n="GLOBAL/BACK"></button>
		</div>
	</div>
	<!-- /ko -->
</form>

<footer class="login-footer">
	<nav aria-labelledby="login-legal-navigation-label">
		<span id="login-legal-navigation-label" class="login-visually-hidden" data-i18n="LOGIN/LEGAL_NAVIGATION">Legal information</span>
		<a href="https://petuja.net/impressum/" data-i18n="LOGIN/LEGAL_IMPRINT">Imprint</a>
		<a href="https://petuja.net/datenschutz" data-i18n="LOGIN/LEGAL_PRIVACY">Privacy</a>
		<a data-bind="visible: petujaEmailSourceUrl, attr: { href: petujaEmailSourceUrl }"
			data-i18n="LOGIN/LEGAL_SOURCE">Source Code</a>
	</nav>
</footer>

<p class="login-product-version" data-bind="visible: petujaEmailVersion && petujaEmailSnappyMailVersion">
	<span>petuja.email </span><span data-bind="text: petujaEmailVersion"></span>
	<span> · based on SnappyMail </span><span data-bind="text: petujaEmailSnappyMailVersion"></span>
</p>
