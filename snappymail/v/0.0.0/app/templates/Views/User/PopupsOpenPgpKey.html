<header class="g-ui-user-select-none">
	<button type="button" class="close ui-icon-only" data-bind="click: close" data-ui-icon="x" data-i18n="[aria-label]GLOBAL/CLOSE"></button>
	<h3 data-i18n="OPENPGP/POPUP_VIEW_TITLE"></h3>
</header>
<div class="modal-body">
	<pre data-bind="initDom: keyDom, text: key"></pre>
</div>
<footer>
	<button type="button" class="btn buttonClose" data-bind="click: close" data-ui-icon="x" data-i18n="GLOBAL/CLOSE"></button>
	<button type="button" class="btn buttonClose" data-bind="click: selectKey" data-ui-icon="key-round" data-i18n="OPENPGP/POPUP_VIEW_BUTTON"></button>
</footer>
