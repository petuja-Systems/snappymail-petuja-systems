<div data-bind="visible: allowAdditionalAccount">
	<div class="legend">
		<span data-i18n="SETTINGS_ACCOUNTS/LEGEND_ACCOUNTS"></span>
		&nbsp;&nbsp;&nbsp;
		<i class="ui-spinner" style="margin-top: 5px" data-bind="visible: loading"></i>
	</div>
	<div data-bind="component: {
		name: 'Checkbox',
		params: {
			label: 'SETTINGS_ACCOUNTS/SHOW_UNREAD',
			value: showUnread
		}
	}"></div>
	<button type="button" class="btn" data-bind="click: addNewAccount">
		<i class="" data-ui-icon="user-round-plus"></i>
		<span data-i18n="SETTINGS_ACCOUNTS/BUTTON_ADD_ACCOUNT"></span>
	</button>
	<table class="table table-hover list-table accounts-list" data-bind="i18nUpdate: accounts">
		<tbody data-bind="foreach: accounts">
			<tr draggable="true" data-bind="attr: {draggable:isAdditional}, sortableItem: { list: $root.accounts, afterMove: $root.accountsAndIdentitiesAfterMove }">
				<!-- ko if:!isAdditional() -->
				<td></td>
				<td colspan="3" data-bind="text: displayName"></td>
				<!-- /ko -->
				<!-- ko if:isAdditional -->
				<td>
					<i class="ui-icon drag-handle" data-ui-icon="grip-vertical"></i>
				</td>
				<td class="e-action">
					<button type="button" class="account-name ui-text-action" data-bind="text: displayName"></button>
				</td>
<!--
				<td><span data-bind="click: importAll" data-ui-icon="folder-input"></span></td>
-->
				<td>
					<button type="button" class="btn btn-small btn-danger button-confirm-delete" data-bind="css: {'delete-access': askDelete}, hasfocus: askDelete, click: function(oAccount) { $root.deleteAccount(oAccount); }"
						data-i18n="GLOBAL/ARE_YOU_SURE"></button>
				</td>
				<td>
					<button type="button" class="delete ui-icon ui-icon-only" data-bind="visible: !askDelete(), click: function (oAccount) { $root.accountForDeletion(oAccount); }" data-ui-icon="trash-2" data-i18n="[aria-label]GLOBAL/DELETE"></button>
				</td>
				<!-- /ko -->
			</tr>
		</tbody>
	</table>
</div>
<div data-bind="visible: allowIdentities">
	<div class="legend" data-i18n="SETTINGS_ACCOUNTS/LEGEND_IDENTITIES"></div>
	<button type="button" class="btn" data-bind="click: addNewIdentity">
		<i class="" data-ui-icon="user-round-plus"></i>
		<span data-i18n="SETTINGS_ACCOUNTS/BUTTON_ADD_IDENTITY"></span>
	</button>
	<table class="table table-hover list-table identities-list" data-bind="i18nUpdate: identities">
		<tbody data-bind="foreach: identities">
			<tr draggable="true" data-bind="attr: {'data-identity-id': id}, sortableItem: { list: $root.identities, afterMove: $root.accountsAndIdentitiesAfterMove }">
				<td>
					<i class="ui-icon drag-handle" data-ui-icon="grip-vertical"></i>
				</td>
				<td class="e-action">
					<button type="button" class="identity-name ui-text-action">
						<span data-bind="text: formattedName()"></span>
						&nbsp;&nbsp;
						<span class="identity-default" data-bind="visible: !$context.$index()" data-i18n="GLOBAL/DEFAULT"></span>
					</button>
				</td>
				<td>
					<button type="button" class="btn btn-small btn-danger button-confirm-delete" data-bind="visible: id, css: {'delete-access': askDelete}, hasfocus: askDelete, click: function(oIdentity) { $root.deleteIdentity(oIdentity); }"
						data-i18n="GLOBAL/ARE_YOU_SURE"></button>
				</td>
				<td>
					<button type="button" class="delete ui-icon ui-icon-only" data-bind="visible: !askDelete() && id(), click: function (oIdentity) { $root.identityForDeletion(oIdentity); }" data-ui-icon="trash-2" data-i18n="[aria-label]GLOBAL/DELETE"></button>
				</td>
			</tr>
		</tbody>
	</table>
</div>
