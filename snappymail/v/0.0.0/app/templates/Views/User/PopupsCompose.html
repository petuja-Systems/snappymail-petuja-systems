<header class="g-ui-user-select-none" data-bind="css: {loading: saving() || sending()}">
	<button type="button" class="btn" data-bind="command: sendCommand, tooltipErrorTip: sendErrorDesc, css: {'btn-success': sendButtonSuccess, 'btn-danger': sendError, 'btn-warning': sendSuccessButSaveError }" data-i18n="[title]COMPOSE/BUTTON_SEND">
		<i data-bind="attr: {'data-ui-icon': 'send'}, css: {'ui-spinner': sending()}"></i>
		<span class="hide-mobile" data-i18n="COMPOSE/BUTTON_SEND"></span>
	</button>
	<button type="button" class="btn button-save" data-bind="command: saveCommand, tooltipErrorTip: savedErrorDesc, css: {'btn-danger': savedError }" data-i18n="[title]GLOBAL/SAVE">
		<i class="ui-icon" data-bind="css: {'ui-spinner': saving()}" data-ui-icon="save"></i>
		<span class="hide-mobile" data-i18n="GLOBAL/SAVE"></span>
	</button>

	<button type="button" class="btn btn-danger button-delete ui-icon" data-bind="command: deleteCommand" data-ui-icon="trash-2" data-i18n="[title]GLOBAL/DELETE"></button>
	<span class="saved-text hide-mobile" data-bind="text: savedTimeText"></span>

	<div class="pull-right">
		<button type="button" class="btn hide-mobile" data-i18n="GLOBAL/BCC" data-bind="visible: !showBcc(), toggle: showBcc"></button>
		<button type="button" class="btn hide-mobile" data-i18n="GLOBAL/CC" data-bind="visible: !showCc(), toggle: showCc"></button>
		<button type="button" class="btn ui-icon" data-bind="visible: allowContacts, command: contactsCommand" data-i18n="[title]GLOBAL/CONTACTS" data-ui-icon="contact-round"></button>
		<div class="btn-group dropdown" data-bind="registerBootstrapDropdown: true" style="display:inline-block;vertical-align:top">
			<button type="button" class="btn dropdown-toggle ui-icon" aria-haspopup="menu" data-ui-icon="more-horizontal" data-i18n="[title]GLOBAL/MORE"></button>
			<menu class="dropdown-menu right-edge" role="menu">
				<li data-bind="toggle: showBcc">
					<a href="#" tabindex="-1" role="menuitemcheckbox" data-bind="attr: {'aria-checked': showBcc() ? 'true' : 'false'}">
						<i data-bind="attr: {'data-ui-icon': showBcc() ? 'square-check' : 'square'}"></i>
						<span data-i18n="GLOBAL/BCC"></span>
					</a>
				</li>
				<li data-bind="toggle: showCc">
					<a href="#" tabindex="-1" role="menuitemcheckbox" data-bind="attr: {'aria-checked': showCc() ? 'true' : 'false'}">
						<i data-bind="attr: {'data-ui-icon': showCc() ? 'square-check' : 'square'}"></i>
						<span data-i18n="GLOBAL/CC"></span>
					</a>
				</li>
				<li data-bind="toggle: showReplyTo">
					<a href="#" tabindex="-1" role="menuitemcheckbox" data-bind="attr: {'aria-checked': showReplyTo() ? 'true' : 'false'}">
						<i data-bind="attr: {'data-ui-icon': showReplyTo() ? 'square-check' : 'square'}"></i>
						<span data-i18n="GLOBAL/REPLY_TO"></span>
					</a>
				</li>
				<li data-bind="toggle: requestReadReceipt">
					<a href="#" tabindex="-1" role="menuitemcheckbox" data-bind="attr: {'aria-checked': requestReadReceipt() ? 'true' : 'false'}">
						<i data-bind="attr: {'data-ui-icon': requestReadReceipt() ? 'square-check' : 'square'}"></i>
						<span data-i18n="COMPOSE/BUTTON_REQUEST_READ_RECEIPT"></span>
					</a>
				</li>
				<li data-bind="toggle: requestDsn">
					<a href="#" tabindex="-1" role="menuitemcheckbox" data-bind="attr: {'aria-checked': requestDsn() ? 'true' : 'false'}">
						<i data-bind="attr: {'data-ui-icon': requestDsn() ? 'square-check' : 'square'}"></i>
						<span data-i18n="COMPOSE/BUTTON_REQUEST_DSN"></span>
					</a>
				</li>
				<li data-bind="toggle: requireTLS">
					<a href="#" tabindex="-1" role="menuitemcheckbox" data-bind="attr: {'aria-checked': requireTLS() ? 'true' : 'false'}">
						<i data-bind="attr: {'data-ui-icon': requireTLS() ? 'square-check' : 'square'}"></i>
						<span data-i18n="COMPOSE/BUTTON_REQUIRE_TLS"></span>
					</a>
				</li>
				<li data-bind="toggle: markAsImportant">
					<a href="#" tabindex="-1" role="menuitemcheckbox" data-bind="attr: {'aria-checked': markAsImportant() ? 'true' : 'false'}">
						<i data-bind="attr: {'data-ui-icon': markAsImportant() ? 'square-check' : 'square'}"></i>
						<span data-i18n="COMPOSE/BUTTON_MARK_AS_IMPORTANT"></span>
					</a>
				</li>
				<li data-bind="toggle: doSign, visible: canSign">
					<a href="#" tabindex="-1" role="menuitemcheckbox" data-bind="attr:{title: signOptionsText, 'aria-checked': doSign() ? 'true' : 'false'}">
						<i data-bind="attr: {'data-ui-icon': doSign() ? 'square-check' : 'square'}"></i>
						<span data-ui-icon="pen-line" data-i18n="CRYPTO/SIGN"></span>
					</a>
				</li>
				<li data-bind="toggle: doEncrypt, visible: canEncrypt">
					<a href="#" tabindex="-1" role="menuitemcheckbox" data-bind="attr:{title: encryptOptionsText, 'aria-checked': doEncrypt() ? 'true' : 'false'}">
						<i data-bind="attr: {'data-ui-icon': doEncrypt() || 'mailvelope' == viewArea() ? 'square-check' : 'square'}"></i>
						<span data-ui-icon="lock-keyhole" data-i18n="CRYPTO/ENCRYPT"></span>
					</a>
				</li>
			</menu>
		</div>
		<button type="button" class="btn ui-icon button-minimize" data-bind="click: skipCommand" data-i18n="[title]COMPOSE/BUTTON_MINIMIZE" data-ui-icon="minus"></button>
		<button type="button" class="btn ui-icon button-close" data-bind="click: doClose" data-i18n="[title]GLOBAL/CANCEL" data-ui-icon="x"></button>
	</div>
</header>
<div class="modal-body">
	<div class="b-header g-ui-user-select-none">
		<table>
			<tr>
				<td data-i18n="GLOBAL/FROM"></td>
				<td>
					<!-- ko if: allowIdentities -->
					<input type="text" data-bind="textInput: from">
					<!-- /ko -->
					<span class="e-identity" data-bind="hidden: allowIdentities, text: from"></span>
					<!-- ko if: 1 < identitiesOptions().length -->
					<div class="dropdown" style="display:inline-block" data-bind="registerBootstrapDropdown: true, initDom: identitiesMenu">
						<button type="button" class="dropdown-toggle" id="identity-toggle" aria-haspopup="menu" data-bind="attr: {'aria-label': from()}" data-ui-icon-after="chevron-down"></button>
						<menu class="dropdown-menu right-edge" role="menu" aria-labelledby="identity-toggle" data-bind="foreach: identitiesOptions">
							<li role="presentation">
								<a tabindex="-1" href="#" data-bind="click: function (oIdentity) { $root.selectIdentity(oIdentity); return true; }, text: optText"></a>
							</li>
						</menu>
					</div>
					<!-- /ko -->
				</td>
			</tr>
			<tr>
				<td>
					<label data-bind="css: {'error-to': emptyToError}, tooltipErrorTip: emptyToErrorTooltip"
						data-i18n="GLOBAL/TO"></label>
				</td>
				<td>
					<input type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-bind="emailsTags: to, autoCompleteSource: emailsSource">
				</td>
			</tr>
			<tr class="cc-row" data-bind="visible: showCc">
				<td data-i18n="GLOBAL/CC"></td>
				<td>
					<input type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-bind="emailsTags: cc, autoCompleteSource: emailsSource">
				</td>
			</tr>
			<tr class="bcc-row" data-bind="visible: showBcc">
				<td data-i18n="GLOBAL/BCC"></td>
				<td>
					<input type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-bind="emailsTags: bcc, autoCompleteSource: emailsSource">
				</td>
			</tr>
			<tr class="reply-to-row" data-bind="visible: showReplyTo">
				<td data-i18n="GLOBAL/REPLY_TO"></td>
				<td>
					<input type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-bind="emailsTags: replyTo">
				</td>
			</tr>
			<tr>
				<td data-i18n="GLOBAL/SUBJECT"></td>
				<td>
					<input type="text" name="subject" autocomplete="off" data-bind="textInput: subject, attr:{spellcheck:allowSpellcheck()?'true':'false'}">
				</td>
			</tr>
		</table>
		<div style="display:flex">
			<div class="btn-group" style="flex-grow:1"></div>
			<div class="btn-group">
				<button type="button" class="btn ui-icon" data-bind="toggle: doSign, visible: canSign, css: {'btn-success': doSign()}, attr: {'aria-pressed': doSign() ? 'true' : 'false'}" data-i18n="[title]CRYPTO/SIGN" data-ui-icon="pen-line">

				</button>
				<button type="button" class="btn ui-icon" data-bind="toggle: doEncrypt, visible: canEncrypt, css: {'btn-success': doEncrypt() || 'mailvelope' == viewArea()}, attr: {'aria-pressed': doEncrypt() ? 'true' : 'false'}" data-i18n="[title]CRYPTO/ENCRYPT" data-ui-icon="lock-keyhole">

				</button>
			</div>
			<div class="btn-group">
				<button type="button" class="btn ui-icon" style="padding-left: 10px; padding-right: 10px;" id="composeUploadButton"
					data-bind="visible: addAttachmentEnabled()" data-i18n="[title]COMPOSE/ATTACH_FILES" data-ui-icon="paperclip">

				</button>
			</div>
		</div>
	</div>

	<div class="tabs">
		<input type="radio" name="tabs" value="body" id="tab-body" data-bind="checked: viewArea">
		<label for="tab-body"
			role="tab"
			aria-selected="true"
			aria-controls="panel1"
			tabindex="0">
			<i class="" data-ui-icon="file-text"></i>
			<span data-i18n="GLOBAL/TEXT"></span>
		</label>
		<div class="tab-content" role="tabpanel" aria-hidden="false" style="grid-column-end:4">
			<div class="textAreaParent" data-bind="initDom: editorArea, attr:{spellcheck:allowSpellcheck()?'true':'false'}"></div>
		</div>

		<input type="radio" name="tabs" value="attachments" id="tab-attachments" data-bind="checked: viewArea">
		<label for="tab-attachments"
			role="tab"
			aria-selected="false"
			aria-controls="panel2"
			tabindex="0"
			data-bind="
				css: { 'btn-danger': attachmentsInErrorCount() },
				tooltipErrorTip: attachmentsErrorTooltip">
			<b data-bind="visible: attachmentsCount, text: attachmentsCount"></b>
			<i data-bind="attr: {'data-ui-icon': 'paperclip'}, css: {'ui-spinner': attachmentsInProcessCount()}"></i>
			<span data-i18n="GLOBAL/ATTACHMENTS"></span>
		</label>
		<div class="tab-content attachmentAreaParent" role="tabpanel" aria-hidden="true" style="grid-column-end:4">
			<div class="b-attachment-place" data-bind="visible: addAttachmentEnabled() && dragAndDropVisible(), css: {dragAndDropOver: dragAndDropOver}"
				data-i18n="COMPOSE/ATTACH_DROP_FILES_DESC"></div>
			<ul class="attachmentList" data-bind="foreach: attachments">
				<li class="attachmentItem" data-bind="attr: { title: title }, css: { waiting: waiting, error: '' !== error() }">
					<div class="attachmentIcon">
						<i class="iconMain" data-bind="attr: {'data-ui-icon': iconClass}, visible: !uploading() || 0 === progress()"></i>
						<div class="iconProgress" data-bind="attr: { style: progressStyle }, visible: uploading"></div>
						<div class="iconBG" data-bind="text: progressText, visible: uploading"></div>
					</div>
					<div class="attachmentNameParent">
						<a href="#" class="close pull-right" style="margin-top:-4px;" data-bind="click: cancel" data-ui-icon="x" data-i18n="[title]GLOBAL/CLOSE"></a>
						<div class="attachmentName" data-bind="text: fileName"></div>
						<span class="attachmentSize" data-bind="text: friendlySize"></span>
					</div>
				</li>
			</ul>
			<div class="no-attachments-desc" data-bind="visible: 0 === attachments().length"
				data-i18n="COMPOSE/NO_ATTACHMENTS_HERE_DESC"></div>
		</div>

		<input type="radio" name="tabs" value="mailvelope" id="tab-mailvelope" data-bind="checked: viewArea">
		<label for="tab-mailvelope"
			role="tab"
			aria-selected="false"
			aria-controls="panel3"
			tabindex="0"
			data-bind="visible: canMailvelope">
			<i class="mailvelope-icon"></i>
			<span>Mailvelope</span>
		</label>
		<div class="tab-content textAreaParent" id="mailvelope-editor" role="tabpanel" aria-hidden="true" style="grid-column-end:4" data-bind="visible: canMailvelope"></div>
	</div>
</div>
