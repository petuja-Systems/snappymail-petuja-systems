# See: https://github.com/GoogleContainerTools/container-structure-test
# See: https://github.com/GoogleContainerTools/container-structure-test/issues/78
schemaVersion: 2.0.0
commandTests:
  - name: Integration test
    command: /bin/sh
    args:
      - -c
      - |
          set -eux
          DEBUG=true /entrypoint.sh > /tmp/test 2>&1 &
          sleep 5
          cat /tmp/test
          pidof supervisord
          pidof nginx
          pidof php-fpm
          ls -al /var/lib/snappymail/_data_/_default_/configs/application.ini
          ls -al /var/lib/snappymail/_data_/_default_/admin_password.txt
          nc -vz 127.0.0.1 8888
          nc -vz 127.0.0.1 9000
          grep -Fx 'listen = 127.0.0.1:9000' /usr/local/etc/php-fpm.d/php-fpm.conf
          grep -Fx 'listen.allowed_clients = 127.0.0.1' /usr/local/etc/php-fpm.d/php-fpm.conf
          non_loopback=0
          for address in $(hostname -i); do
            case "$address" in 127.*|::1) continue ;; esac
            non_loopback=1
            if nc -vz -w 1 "$address" 9000; then exit 1; fi
          done
          test "$non_loopback" = 1
          wget -S -T 3 -O /dev/null http://127.0.0.1:8888
          kill `pidof supervisord`
metadataTest:
  # The php-fpm base image retains 9000 metadata; the loopback listener is the boundary.
  exposedPorts: ["8888", "9000"]
  volumes: ["/var/lib/snappymail"]
  entrypoint: []
  cmd: ["/entrypoint.sh"]
  workdir: /snappymail
  user: root
